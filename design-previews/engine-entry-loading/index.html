 document.getElementById('phase').addEventListener('change',function(event){if(event.target.value==='loading')start();else setPhase(event.target.value)});
 document.getElementById('hold').addEventListener('change',function(event){state.hold=event.target.checked;start()});
 document.getElementById('loop').addEventListener('change',function(event){state.loop=event.target.checked;if(!state.loop)clearTimeout(loopTimer);else if(state.phase==='ready')loopTimer=setTimeout(start,1200)});
 document.getElementById('download-one').addEventListener('click',function(){download(makeStandalone(state.design),fileName(state.design),'text/html;charset=utf-8')});
 document.getElementById('download-all').addEventListener('click',downloadAll);
 document.getElementById('preview').addEventListener('click',function(event){var action=event.target.closest('[data-action]');if(!action)return;if(action.dataset.action==='retry')start();else toast('ตัวอย่างอนิเมชัน · ใช้ข้อมูลจำลองและไม่สั่งงานระบบจริง')});
}
function loader(kind){
 var count='<span class="task-count">0 / 4</span>',label='<p class="step-label">'+tasks[0].name+'</p>';
 if(kind==='skeleton')return '<div class="skeleton-callout loading-only"><i class="skeleton-spinner" aria-hidden="true"></i><span class="step-label">'+tasks[0].name+'</span>'+count+'</div>';
 if(kind==='orbit')return '<div class="page-overlay loading-only"><div class="overlay-card"><div class="orbit-system" aria-hidden="true"><i class="orbit-path outer"></i><i class="orbit-path"></i><div class="orbit-core">'+icon('db')+'</div>'+['SRC','SSS','KKL'].map(function(branch,index){return '<div class="orbit-track '+['','second','third'][index]+'"><span class="orbit-node">'+branch+'</span></div>'}).join('')+'</div><h3>กำลังเชื่อมข้อมูลให้พร้อม</h3>'+label+'<p class="subtle-label">เตรียมข้อมูลแล้ว '+count+'</p><div class="small-ticks" aria-hidden="true">'+tasks.map(function(_,i){return '<i data-step="'+i+'"></i>'}).join('')+'</div></div></div>';
 if(kind==='rail')return '<div class="progress-rail loading-only"><div class="rail-top"><span class="load-badge"><i></i>กำลังเตรียมข้อมูล</span>'+count+'</div><div class="rail-progress"><div class="progress-fill" style="width:0"></div></div><div class="rail-stages">'+tasks.map(function(task,i){return '<span data-step="'+i+'"><i></i>'+task.short+'</span>'}).join('')+'</div></div>';
 if(kind==='cascade')return '<div class="cascade-guide loading-only"><span class="cascade-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="step-label">'+tasks[0].name+'</span>'+count+'</div>';
 if(kind==='scan')return '<div class="table-scan-label loading-only"><div><span class="scan-cross" aria-hidden="true"></span>'+label+'</div>'+count+'</div>';
 if(kind==='branches')return '<div class="branch-hub loading-only">'+icon('db','loader-icon')+'<span class="step-label">'+tasks[0].name+'</span>'+count+'</div>';
 if(kind==='conveyor')return '<div class="conveyor loading-only"><div class="conveyor-path"><div class="flow-end">'+icon('cloud')+'Supabase</div><div class="packet-lane" aria-hidden="true"><i class="packet"></i><i class="packet"></i><i class="packet"></i></div><div class="flow-end target">'+icon('engine')+'Workspace</div></div><div class="flow-caption">'+label+count+'</div></div>';
 if(kind==='focus')return '<div class="page-overlay loading-only"><div class="overlay-card focus-card"><div class="focus-ring"><div class="focus-center"><div class="focus-icon">'+icon('db')+'</div>'+count+'<p>แหล่งข้อมูลพร้อม</p></div></div><h3>อีกนิดเดียว พร้อมเริ่มงาน</h3>'+label+'<p class="subtle-label">PENDING · ราคา · Template</p></div></div>';
 if(kind==='reveal')return '<div class="page-overlay loading-only"><div class="overlay-card reveal-panel"><div class="reveal-mark" aria-hidden="true"><i></i><i></i><i></i><i></i>'+icon('engine')+'</div><h3>กำลังเปิดพื้นที่ทำงาน</h3>'+label+'<p class="subtle-label">ข้อมูลพร้อมแล้ว '+count+'</p></div></div>';
 return '<div class="page-overlay loading-only"><div class="overlay-card checklist-card"><header class="checklist-header"><div><h3>เตรียมข้อมูลก่อนเริ่มงาน</h3><p>กำลังโหลดข้อมูลจาก Supabase</p></div>'+icon('db','loader-icon')+'</header><div class="checklist-rows">'+tasks.map(function(task,i){return '<div class="check-row" data-step="'+i+'"><span class="check-bubble">'+(i+1)+'</span><span class="check-copy"><b>'+task.name+'</b><small>'+task.detail+'</small></span><span class="check-tag">รอโหลด</span></div>'}).join('')+'</div><footer class="checklist-footer"><span>พร้อมแล้ว '+count+'</span><span>4 แหล่งข้อมูล</span></footer></div></div>';
}
function paintCanvas(){
 var d=designs[state.design],floating=['orbit','focus','reveal','checklist'].indexOf(d.kind)>=0;
 var samples=[
 ['00001','พาราเซตามอล 500 มก.','35.00','39.00','35.00','ราคาไม่ตรง + เพิ่มเอง'],
 ['00002','น้ำเกลือ 100 มล.','28.00','28.00','28.00','เพิ่มเอง'],
 ['00003','ครีมบำรุงผิว 100 กรัม','129.00','139.00','129.00','ราคาไม่ตรง']
 ];
 var node=document.getElementById('preview');
 node.dataset.kind=d.kind;
 node.innerHTML=[
 '<aside class="mock-rail" aria-hidden="true"><div class="mock-logo">'+icon('tag')+'</div><span class="mock-nav">'+icon('box')+'</span><span class="mock-nav">'+icon('tag')+'</span><span class="mock-nav active">'+icon('engine')+'</span><span class="mock-nav">'+icon('tools')+'</span><span class="mock-profile">AN</span></aside>',
 '<div class="mock-workspace"><header class="mock-page-header"><div><p class="eyebrow">PRICE CHECKER / STOCK OPERATIONS</p><h2>PROCESS ENGINE<span>.</span></h2></div><span class="workspace-label">ANIN<i></i>WORKSPACE</span></header>',
 !floating?'<div class="loader-slot">'+loader(d.kind)+'</div>':'',
 '<section class="workspace-card prep-card"><p class="card-eyebrow">01 / PREPARE</p><div class="card-title-row"><div><h3>ดึงจำนวนสินค้าในระบบ</h3><p class="card-copy">เข้าสู่ระบบก่อนดึงข้อมูล</p></div><button class="mock-button db-action" data-action="mock">'+icon('refresh')+'ดึงจากฐานข้อมูล</button></div><div class="stock-grid">',
 ['SRC','SSS','KKL'].map(function(branch){return '<div class="branch-card"><div class="branch-top"><b>'+branch+'</b><small>รอข้อมูลสต็อก</small></div><p>ดึงจากฐานข้อมูล</p><i class="branch-signal" aria-hidden="true"></i></div>'}).join(''),
 '</div></section><section class="workspace-card pending-card"><p class="card-eyebrow">02 / PENDING APPROVAL</p><div class="card-title-row"><div><h3>PENDING SKU UPDATE</h3><p class="card-copy">รวมรายการเพิ่มเองและราคาไม่ตรง · แยกตามสาขา</p></div>'+datum('<span class="mock-count">18 SKUs</span>')+'</div><div class="mock-tabs"><span class="mock-tab active">SRC '+datum('(12)')+'</span><span class="mock-tab">SSS '+datum('(8)')+'</span><span class="mock-tab">KKL '+datum('(5)')+'</span></div>',
 '<div class="table-scroll"><table class="mock-table" aria-label="ตารางสินค้า PENDING จำลอง"><thead><tr><th>SKU</th><th>ชื่อสินค้า</th><th>ราคา DB</th><th>GRAB SRC</th><th>Promaxx</th><th>สาเหตุ</th><th>จัดการ</th></tr></thead><tbody>',
 samples.map(function(row){return '<tr><td class="sku">'+datum(row[0])+'</td><td>'+datum(row[1])+'</td><td>'+datum(row[2])+'</td><td class="warn">'+datum(row[3])+'</td><td>'+datum(row[4])+'</td><td>'+datum('<span class="reason-pill'+(row[5]==='เพิ่มเอง'?' manual':'')+'">'+row[5]+'</span>')+'</td><td>'+datum('<span class="table-action">นำออกจาก PENDING</span>')+'</td></tr>'}).join(''),
 '</tbody></table></div><div class="pending-foot"><span>'+datum('ข้อมูลตัวอย่าง 3 จาก 12 รายการ')+'</span><span class="tiny-dots">1 / 1</span></div></section>',
 '<section class="workspace-card run-card"><p class="card-eyebrow">03 / PROCESS</p><div class="run-row"><div><h3>ตรวจคู่ไฟล์และเติมสต็อก</h3><p class="card-copy">เตรียมข้อมูลครบแล้วจึงเริ่มงานได้</p></div><button class="mock-button run" data-action="mock">'+icon('play')+'RUN</button></div></section>',
 '<footer class="preview-status"><span><i class="ready-dot"></i><span id="preview-status-text">กำลังเตรียมข้อมูล...</span></span><span class="source-code">PRICE CHECKER / PROCESS ENGINE</span></footer></div>',
 floating?loader(d.kind):'',
 '<div class="error-panel"><div class="error-card" role="alert"><div class="error-icon">'+icon('alert')+'</div><h3>โหลดข้อมูลไม่สำเร็จ</h3><p>ข้อมูลยังไม่พร้อมใช้งาน ลองโหลดใหม่เพื่อเตรียมรายการล่าสุด</p><button class="button primary" data-action="retry">'+icon('refresh')+'ลองอีกครั้ง</button></div></div>'
 ].join('');
 update();
}
function update(){
 var preview=document.getElementById('preview'),completed=state.phase==='ready'?4:Math.min(3,Math.floor(state.progress*4));
 preview.className='preview-app phase-'+state.phase;
 preview.setAttribute('aria-busy',String(state.phase==='loading'));
 preview.style.setProperty('--turn',(completed*90)+'deg');
 document.getElementById('phase').value=state.phase;
 preview.querySelectorAll('.task-count').forEach(function(node){node.textContent=completed+' / 4'});
 preview.querySelectorAll('.step-label').forEach(function(node){node.textContent=tasks[Math.min(completed,3)].name});
 preview.querySelectorAll('.progress-fill').forEach(function(node){node.style.width=(completed*25)+'%'});
 preview.querySelectorAll('[data-step]').forEach(function(node){
  var index=Number(node.dataset.step),done=index<completed,current=index===completed&&state.phase==='loading';
  node.classList.toggle('is-done',done);node.classList.toggle('is-current',current);
  var bubble=node.querySelector('.check-bubble'),tag=node.querySelector('.check-tag');
  if(bubble)bubble.textContent=done?'✓':String(index+1);
  if(tag)tag.textContent=done?'สำเร็จ':current?'กำลังโหลด':'รอโหลด';
 });
 preview.querySelectorAll('button[data-action="mock"]').forEach(function(button){button.disabled=state.phase!=='ready'});
 document.getElementById('preview-status-text').textContent=state.phase==='ready'?'ข้อมูลพร้อมใช้งาน':state.phase==='error'?'รอโหลดข้อมูลใหม่':'กำลังเตรียมข้อมูล...';
 if(lastStep!==completed||state.phase!=='loading'){
  document.getElementById('announcer').textContent=state.phase==='ready'?'เตรียมข้อมูลครบ พร้อมใช้งาน':state.phase==='error'?'โหลดข้อมูลไม่สำเร็จ เลือกลองอีกครั้งเพื่อโหลดใหม่':tasks[completed].name+' · พร้อมแล้ว '+completed+' จาก 4 แหล่งข้อมูล';
  lastStep=completed;
 }
}
function clearTimers(){clearInterval(interval);clearTimeout(loopTimer);interval=null;loopTimer=null}
function start(){
 clearTimers();state.phase='loading';state.progress=0;lastStep=-1;started=performance.now();update();
 interval=setInterval(function(){
  state.progress=(performance.now()-started)/state.duration;
  if(state.hold)state.progress=Math.min(.86,state.progress);
  if(state.progress>=1){setPhase('ready');return}
  update();
 },100);
}
function setPhase(phase){clearTimers();state.phase=phase;if(phase==='ready')state.progress=1;update();if(phase==='ready'&&state.loop)loopTimer=setTimeout(start,1200)}
function selectDesign(index,scroll){
 state.design=Math.max(0,Math.min(9,index));var d=designs[state.design];
 document.querySelectorAll('[data-design]').forEach(function(button){var active=Number(button.dataset.design)===state.design;button.classList.toggle('is-selected',active);button.setAttribute('aria-pressed',String(active))});
 document.getElementById('design-number').textContent=d.id;document.getElementById('design-title').textContent=d.name;document.getElementById('design-hint').textContent=d.hint;
 document.getElementById('pattern-label').textContent=d.pattern;document.getElementById('design-caption-title').textContent=d.id+' / '+d.name;document.getElementById('design-note').textContent=d.note;
 document.title=d.id+' '+d.name+' · PROCESS ENGINE Loading';
 paintCanvas();start();
 if(scroll&&matchMedia('(max-width:619px)').matches)document.getElementById('design-title').scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
}
function makeHtml(index,standalone){
 var root=document.documentElement.cloneNode(true);root.querySelector('#gallery-config').textContent=JSON.stringify({design:index,standalone:standalone});
 root.querySelector('#app').replaceChildren();root.querySelector('#toast').textContent='';root.querySelector('#toast').className='toast';root.querySelector('body').className='';
 root.querySelector('title').textContent=standalone?designs[index].id+' '+designs[index].name+' · PROCESS ENGINE Loading':'PROCESS ENGINE · 10 Loading Animations';
 return '<!doctype html>\n'+root.outerHTML;
}
function makeStandalone(index){return makeHtml(index,true)}
function download(content,name,type){var url=URL.createObjectURL(new Blob([content],{type:type})),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500)}
function zipFiles(files){
 var encoder=new TextEncoder(),chunks=[],central=[],offset=0,centralSize=0;
 function crc32(data){var crc=0xffffffff;for(var i=0;i<data.length;i++){crc^=data[i];for(var bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return (crc^0xffffffff)>>>0}
 files.forEach(function(file){
  var name=encoder.encode(file.name),data=encoder.encode(file.content),crc=crc32(data),local=new Uint8Array(30+name.length),view=new DataView(local.buffer);
  view.setUint32(0,0x04034b50,true);view.setUint16(4,20,true);view.setUint16(6,0x800,true);view.setUint16(12,0x21,true);view.setUint32(14,crc,true);view.setUint32(18,data.length,true);view.setUint32(22,data.length,true);view.setUint16(26,name.length,true);local.set(name,30);
  var entry=new Uint8Array(46+name.length),entryView=new DataView(entry.buffer);
  entryView.setUint32(0,0x02014b50,true);entryView.setUint16(4,20,true);entryView.setUint16(6,20,true);entryView.setUint16(8,0x800,true);entryView.setUint16(14,0x21,true);entryView.setUint32(16,crc,true);entryView.setUint32(20,data.length,true);entryView.setUint32(24,data.length,true);entryView.setUint16(28,name.length,true);entryView.setUint32(42,offset,true);entry.set(name,46);
  chunks.push(local,data);central.push(entry);offset+=local.length+data.length;centralSize+=entry.length;
 });
 var end=new Uint8Array(22),endView=new DataView(end.buffer);endView.setUint32(0,0x06054b50,true);endView.setUint16(8,files.length,true);endView.setUint16(10,files.length,true);endView.setUint32(12,centralSize,true);endView.setUint32(16,offset,true);
 var result=new Uint8Array(offset+centralSize+end.length),position=0;chunks.concat(central,[end]).forEach(function(chunk){result.set(chunk,position);position+=chunk.length});return result;
}
function downloadAll(){
 var files=[{name:'index.html',content:makeHtml(0,false)}].concat(designs.map(function(_,index){return {name:fileName(index),content:makeStandalone(index)}}));
 download(zipFiles(files),'process-engine-loading-10-designs.zip','application/zip');toast('ดาวน์โหลดไฟล์รวม 10 แบบ พร้อมหน้าเลือกตัวอย่าง');
}
shell();selectDesign(state.design,false);
window.motionGallery={designs:designs,selectDesign:selectDesign,makeStandalone:makeStandalone,makeGallery:function(){return makeHtml(0,false)},setPhase:setPhase,replay:start,getState:function(){return Object.assign({},state)}};
})();
</script>
